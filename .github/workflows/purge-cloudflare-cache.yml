# Purges the Cloudflare cache after every successful GitHub Pages deploy,
# so the CDN serves the new files without waiting for the cache to expire.
# Requires the CLOUDFLARE_API_TOKEN (Zone > Cache Purge) and CLOUDFLARE_ZONE_ID
# repository secrets.
name: Purge Cloudflare cache

on:
  # Pages is published from the branch, through GitHub's built-in workflow.
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
  # Manual purge from the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge everything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?missing secret}" "${CLOUDFLARE_ZONE_ID:?missing secret}"
          # No --fail: on errors Cloudflare still answers with a JSON body
          # ("success": false plus "errors"), which is printed and checked below.
          response=$(curl --silent --show-error --retry 3 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          if ! jq -e '.success == true' <<<"$response" > /dev/null; then
            echo "::error::Cloudflare cache purge failed"
            exit 1
          fi
